name: green_app
description: "GREEN — détection hors ligne des maladies des cultures (maïs, manioc, tomate) et assistant agricole GreenBot."
publish_to: 'none'

# Format : MAJEUR.MINEUR.CORRECTIF+CODE_DE_VERSION_ANDROID
# Le code (+2) doit augmenter à chaque APK publié, sinon Android refuse la
# mise à jour par-dessus l'ancienne version. Garder lib/core/app_info.dart
# aligné (vérifié par test/app_info_test.dart).
version: 2.2.0+4

environment:
  # Versions vérifiées le 7 novembre 2026 : Flutter 3.47.8 (stable), Dart 3.13.7.
  # go_router 18 exige Flutter >= 3.44 ; la contrainte suit la version installée.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Textes système (copier/coller, licences…) en français et en anglais.
  flutter_localizations:
    sdk: flutter

  # État et navigation
  provider: ^6.1.5+1
  go_router: ^18.1.3

  # Réseau et IA en ligne
  http: ^1.6.0
  # Reprise automatique des envois GREEN Web au retour du réseau.
  connectivity_plus: ^7.3.2
  google_generative_ai: ^0.4.7

  # Images et vision hors ligne
  image_picker: ^1.2.4
  # Reste en 8.x : version déjà validée en build release sur ce projet (AGP 8).
  image_cropper: ^8.1.0
  image: ^4.12.0
  # Moteur d'inférence hors ligne de classifier_v1 (2.2.0) : TensorFlow Lite.
  tflite_flutter: ^0.12.1
  # 2.2.0 : flutter_onnxruntime retiré (ancien modèle ONNX à 11 classes supprimé).

  # Audio (messages vocaux GreenBot). Reste en 6.x : record 7 / record_android 2
  # exigent AGP 9 et le Kotlin intégré, que ce projet n'utilise pas encore.
  record: ^6.2.1

  # Stockage local
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0

  # Utilitaires
  uuid: ^4.6.0
  crypto: ^3.0.8
  flutter_dotenv: ^6.0.1
  intl_phone_field: ^3.2.0
  # Reste en 13.x : version déjà validée en build release sur ce projet.
  geolocator: ^13.0.4
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 2.2.0 : test d'acceptation de classifier_v1 sur téléphone (fourni avec le
  # SDK Flutter, rien à télécharger) :
  # flutter test integration_test/classifier_v1_acceptance_test.dart -d <appareil>
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Modèle de vision classifier_v1 (2.2.0) : configuration + .tflite et
    # labels.txt. Le .tflite n'est pas compressé dans l'APK (noCompress dans
    # android/app/build.gradle.kts). Voir README, « Modèle de vision ».
    - assets/models/active_model.json
    - assets/models/tflite/
    - assets/rag/chunks.json
    - assets/data/diseases.json
    # Fichier de clés (non versionné, voir .env.example). Il doit exister au
    # moment du build, même vide, sinon `flutter build` échoue.
    - assets/.env
