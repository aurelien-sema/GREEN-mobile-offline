# Mémoire du démon Gradle. 4 Go suffisent pour un APK release Flutter et
# laissent de la marge sur une machine de 16 Go (8 Go saturaient la RAM).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Conservé : certaines bibliothèques natives transitives peuvent encore en dépendre.
android.enableJetifier=true

# Ajoutés par le migrateur de Flutter 3.44+ : le projet reste sur AGP 8.x et
# le plugin Kotlin classique tant que tous les plugins utilisés n'ont pas
# migré vers AGP 9 / Kotlin intégré (voir CHANGELOG.md, section Build).
android.builtInKotlin=false
android.newDsl=false

# JDK utilisé par Gradle. Ne pas fixer de chemin ici : il dépend de chaque
# machine. Le JDK est choisi par `flutter config --jdk-dir=<chemin>` (voir
# BUILD_RELEASE.md), ou à défaut par JAVA_HOME. JDK 17 minimum, 21 conseillé.
